services:
  searxng:
    image: searxng/searxng:latest
    container_name: market-intelligence-searxng
    restart: unless-stopped
    ports:
      - "18081:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:18081/"
      FORCE_OWNERSHIP: "true"
    volumes:
      - ./searxng/config:/etc/searxng
      - ./searxng/data:/var/cache/searxng
