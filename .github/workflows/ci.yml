name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pyyaml langgraph langchain-core pydantic

      - name: Validate 28 Locked Architecture Components
        run: |
          python scripts/validate_architecture.py

      - name: Run G1-G4 Capability Tests
        run: |
          python scripts/test_loop_engineering_enhancements.py

      - name: Run G5.1 Remediation Target Swap Tests
        run: |
          python scripts/test_remediation_target_swap.py

      - name: Run Opaque E2E Governance Test Suite
        run: |
          pytest tests/test_e2e_governance_requirements.py -v
